name: Publish AAR to Flutter SDK

# Runs after every merge to dev — builds the release AAR and commits it
# directly into verity_flutter_sdk/android/libs/ so the Flutter wrapper
# always ships the latest Android SDK without a manual `update_android_aar.sh`.
#
# Prerequisites (one-time, done by a repo admin):
#   1. Create a GitHub PAT with `repo` scope (Contents: write) for
#      TopRateTransfer-Pty-Ltd/verity_flutter_sdk.
#   2. Add it as org secret VERITY_CROSS_REPO_PAT (or repo secret on both repos).
#
on:
  push:
    branches: [dev]
  workflow_dispatch:   # allow manual trigger for hotfixes

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android SDK
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release AAR
        run: ./gradlew :veritypro-sdk:assembleRelease --no-daemon

      - name: Verify AAR camera classes
        run: |
          AAR=veritypro-sdk/build/outputs/aar/veritypro-sdk-release.aar
          if [ ! -f "$AAR" ]; then
            echo "::error::AAR not found: $AAR"
            exit 1
          fi
          COUNT=$(unzip -p "$AAR" classes.jar | jar tf /dev/stdin 2>/dev/null \
            | grep -ciE 'document_overlay|document_capture|camera_utils' || true)
          echo "Camera classes in AAR: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::AAR has no camera classes — aborting"
            exit 1
          fi
          SIZE=$(stat -c%s "$AAR")
          echo "AAR size: $SIZE bytes"
          echo "aar_path=$AAR" >> "$GITHUB_ENV"

      - name: Checkout Flutter SDK wrapper
        uses: actions/checkout@v4
        with:
          repository: TopRateTransfer-Pty-Ltd/verity_flutter_sdk
          ref: Mr.topClaude-work
          path: verity_flutter_sdk
          token: ${{ secrets.VERITY_CROSS_REPO_PAT }}

      - name: Copy AAR into Flutter SDK
        run: |
          cp veritypro-sdk/build/outputs/aar/veritypro-sdk-release.aar \
             verity_flutter_sdk/android/libs/veritypro-sdk-release.aar
          echo "Copied AAR → verity_flutter_sdk/android/libs/veritypro-sdk-release.aar"

      - name: Commit and push updated AAR
        working-directory: verity_flutter_sdk
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if the AAR actually changed (binary diff)
          if git diff --quiet android/libs/veritypro-sdk-release.aar; then
            echo "AAR unchanged — nothing to push"
            exit 0
          fi

          ANDROID_SHA="${{ github.sha }}"
          git add android/libs/veritypro-sdk-release.aar
          git commit -m "chore(android): auto-publish AAR from veritypro-android-sdk-maven@${ANDROID_SHA:0:7}

Triggered by push to dev in veritypro-android-sdk-maven.
Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
