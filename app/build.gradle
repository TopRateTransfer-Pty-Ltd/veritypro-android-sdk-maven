plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk true
        }
    }
    namespace 'com.example.veritypro_android'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.veritypro_android"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        // Read config from env first (CI injects GitHub secrets), else local.properties (dev),
        // else empty. Tolerates a missing local.properties so CI builds without one.
        def properties = new Properties()
        def localPropsFile = project.rootProject.file("local.properties")
        if (localPropsFile.exists()) {
            properties.load(localPropsFile.newDataInputStream())
        }
        def cfg = { String name -> System.getenv(name) ?: properties.getProperty(name, "") }
        buildConfigField "String", "API_KEY", "\"${cfg('API_KEY')}\""
        buildConfigField "String", "INTEGRATION_ID", "\"${cfg('INTEGRATION_ID')}\""
        // Google Places key for address autocomplete — never hard-coded / committed.
        buildConfigField "String", "PLACES_API_KEY", "\"${cfg('GOOGLE_PLACES_API_KEY')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
        android.buildFeatures.buildConfig = true
    }

    packaging {
        resources {
            excludes += [
                    "META-INF/versions/**",
                    "META-INF/OSGI-INF/**",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1"
            ]
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation project(path: ':veritypro-sdk')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.08.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'


    // Material3 for theming the detector
    implementation "androidx.compose.material3:material3:1.4.0"

}