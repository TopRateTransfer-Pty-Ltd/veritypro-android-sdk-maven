name: Android CI

# Builds the demo app + SDK. Secrets (incl. the Google Places key for address autocomplete) are
# injected via env — app/build.gradle reads them into BuildConfig. Nothing is hard-coded/committed.
on:
  # Manual-only (owner, 2026-10-11): SDKs are checked and built locally, not on GitHub Actions.
  # Before opening or merging a PR, run locally and post the result on the PR:
  #     ./gradlew :veritypro-sdk:testDebugUnitTest :verity-device-sdk:testDebugUnitTest :veritypro-sdk:assembleRelease
  # Run this workflow by hand (Actions -> Run workflow) only when a local run is not possible.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes 'tools', which current cmdline-tools no longer
          # ship ("Failed to find package 'tools'" broke every build on 2026-10-04).
          # AGP downloads the platform/build-tools it needs itself.
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # Injected from GitHub repo secrets. GOOGLE_PLACES_API_KEY activates address autocomplete.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          INTEGRATION_ID: ${{ secrets.INTEGRATION_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Unit tests for both SDK modules. Until this step existed CI only compiled the app, so a
      # green run said nothing about the SDKs' tests (veritypro-sdk #45: 3 new test classes had
      # run nowhere). The test reports are uploaded on failure.
      - name: SDK unit tests
        run: ./gradlew :veritypro-sdk:testDebugUnitTest :verity-device-sdk:testDebugUnitTest --no-daemon --stacktrace

      # Release AAR as a run artifact: the Flutter wrapper (verity_flutter_sdk/android/libs) vendors
      # this AAR, so it should come from a CI run tied to a commit sha, not a developer machine.
      - name: Build release AAR
        run: ./gradlew :veritypro-sdk:assembleRelease --no-daemon --stacktrace

      - name: Upload release AAR
        uses: actions/upload-artifact@v4
        with:
          name: veritypro-sdk-release-aar-${{ github.sha }}
          path: veritypro-sdk/build/outputs/aar/veritypro-sdk-release.aar
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            veritypro-sdk/build/reports/tests/
            verity-device-sdk/build/reports/tests/
