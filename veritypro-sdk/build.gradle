plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'maven-publish'
}

android {
    namespace 'com.example.veritypro_sdk'
    compileSdk 36


    defaultConfig {
        minSdk 24
        //noinspection EditedTargetSdkVersion
        targetSdk 36

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

}

dependencies {

    // Core Android
    implementation "androidx.core:core-ktx:1.17.0"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

    // Guava (with exclusion)
    implementation('com.google.guava:guava:33.5.0-android') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    // ML Kit (with exclusions)
    implementation('com.google.mlkit:barcode-scanning:17.3.0') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.mlkit:text-recognition:16.0.1') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.mlkit:object-detection:17.0.2') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.mlkit:face-detection:16.1.7') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation('com.google.android.gms:play-services-mlkit-document-scanner:16.0.0') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2"

    // Firebase Crashlytics (if needed)
    implementation 'com.google.firebase:firebase-crashlytics-buildtools:3.0.6'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.13.13'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    // Compose (use BOM for version management; no individual versions)
    implementation platform('androidx.compose:compose-bom:2025.11.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // CameraX
    implementation "androidx.camera:camera-core:1.5.1"
    implementation "androidx.camera:camera-camera2:1.5.1"
    implementation "androidx.camera:camera-lifecycle:1.5.1"
    implementation "androidx.camera:camera-view:1.5.1"

    // Location
    implementation("com.google.android.gms:play-services-location:21.3.0")

    // Network (OkHttp + Retrofit - correct versions)
    implementation("com.squareup.okhttp3:okhttp:5.3.2")
    implementation("com.squareup.okhttp3:logging-interceptor:5.3.2")
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'

    // Amplify
    implementation "com.amplifyframework:aws-auth-cognito:2.30.4"
    implementation "com.amplifyframework.ui:liveness:1.8.1"

    // ZXing
    implementation 'com.google.zxing:core:3.5.4'

    // Desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    //implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'

    implementation(
            "org.tensorflow:tensorflow-lite:2.17.0")
    implementation("org.tensorflow:tensorflow-lite-gpu:2.17.0")
    implementation("org.tensorflow:tensorflow-lite-support:0.5.0")




    //implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.10.2'

}

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:33.5.0-android'
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = "com.example.veritypro"
                artifactId = "veritypro-sdk"
                version = "1.0.0"
            }
        }
    }
}

publishing {
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/TopRateTransfer-Pty-Ltd/veritypro-android-sdk-maven")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USER")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}


