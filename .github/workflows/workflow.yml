name: Android Release

on:
  push:
    tags:
      - "v*"   # Runs when you push a version tag like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup JDK (required for Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Build the app (APK) and library (AAR)
      - name: Build APK & AAR
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :yourlibrarymodule:assembleRelease

      # Collect artifacts
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            app/build/outputs/apk/release/*.apk
            yourlibrarymodule/build/outputs/aar/*.aar

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Download artifacts from build job
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: android-builds
          path: build-artifacts

      # Create GitHub Release and upload APK + AAR
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/**/*.apk
            build-artifacts/**/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
