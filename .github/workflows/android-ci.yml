name: Android CI

# Builds the demo app + SDK. Secrets (incl. the Google Places key for address autocomplete) are
# injected via env — app/build.gradle reads them into BuildConfig. Nothing is hard-coded/committed.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes 'tools', which current cmdline-tools no longer
          # ship ("Failed to find package 'tools'" broke every build on 2026-10-04).
          # AGP downloads the platform/build-tools it needs itself.
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        env:
          # Injected from GitHub repo secrets. GOOGLE_PLACES_API_KEY activates address autocomplete.
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          INTEGRATION_ID: ${{ secrets.INTEGRATION_ID }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Unit tests for both SDK modules. Until this step existed CI only compiled the app, so a
      # green run said nothing about the SDKs' tests (veritypro-sdk #45: 3 new test classes had
      # run nowhere). The test reports are uploaded on failure.
      - name: SDK unit tests
        run: ./gradlew :veritypro-sdk:testDebugUnitTest :verity-device-sdk:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            veritypro-sdk/build/reports/tests/
            verity-device-sdk/build/reports/tests/
